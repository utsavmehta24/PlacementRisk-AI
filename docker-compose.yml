services:
  postgres:
    image: postgres:15-alpine
    container_name: placementrisk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placementrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-placementrisk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placementrisk} -d ${POSTGRES_DB:-placementrisk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: placementrisk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementrisk-backend
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://placementrisk:changeme@postgres:5432/placementrisk}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-changeme_this_is_a_secret_key_for_jwt_tokens}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_SEED: ${MODEL_SEED:-42}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./mlruns:/mlruns
      - model_artifacts:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementrisk-celery
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://placementrisk:changeme@postgres:5432/placementrisk}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./mlruns:/mlruns
      - model_artifacts:/models
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app worker --loglevel=info --beat
    profiles:
      - mlops

  mlflow:
    image: python:3.10-slim
    container_name: placementrisk-mlflow
    working_dir: /mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    command: >
      bash -c "pip install mlflow==2.9.2 &&
               mlflow server --host 0.0.0.0 --port 5000 
               --backend-store-uri sqlite:///mlflow.db 
               --default-artifact-root /mlflow/artifacts"
    profiles:
      - mlops

  airflow:
    image: apache/airflow:2.7.3-python3.10
    container_name: placementrisk-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://placementrisk:changeme@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'changeme_secret_key'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
    ports:
      - "8080:8080"
    volumes:
      - ./ml_jobs/airflow_dags:/opt/airflow/dags
      - ./data:/data
      - ./backend:/backend
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db init &&
               airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@placementrisk.ai || true &&
               airflow webserver & airflow scheduler"
    profiles:
      - mlops

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placementrisk-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  airflow_logs:
  model_artifacts:
